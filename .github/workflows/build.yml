name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 还原 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          SIZE=$(stat -c%s release.keystore)
          echo "✅ keystore 大小: $SIZE bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "❌ keystore 文件太小，base64 损坏"
            exit 1
          fi

      - name: 注入 Secrets 密码
        run: |
          sed -i "s|android.keystore = .*|android.keystore = /home/runner/work/live-auth/live-auth/release.keystore|" buildozer.spec
          sed -i "s/android.keystore_passwd = .*/android.keystore_passwd = ${{ secrets.KEYSTORE_PASS }}/" buildozer.spec
          sed -i "s/android.keypasswd = .*/android.keypasswd = ${{ secrets.KEY_PASS }}/" buildozer.spec
          sed -i "s/android.keyalias = .*/android.keyalias = ${{ secrets.KEY_ALIAS }}/" buildozer.spec
          echo "📄 当前签名配置："
          grep "android.keystore\|android.key" buildozer.spec

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 检查磁盘 + 增加 swap
        run: |
          df -h
          sudo apt-get clean
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool-bin autoconf libltdl-dev libffi-dev libssl-dev openjdk-17-jdk
          sudo apt-get install -y unzip git zip zlib1g-dev

      -      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.33


      - name: 打包（debug 模式 + 自定义签名）
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: 强制 APK（删除 AAB）
        if: always()
        run: |
          rm -f bin/*.aab
          if ls bin/*.apk 2>/dev/null; then
            APK=$(ls bin/*.apk | head -1)
            echo "✅ 找到 APK: $APK"
            echo "🔏 验证签名："
            jarsigner -verify -verbose:summary -certs "$APK" 2>&1 | grep -E "CN=|warning" | head -3
          else
            echo "❌ 没找到 APK！"
            ls -la bin/ 2>/dev/null
          fi

      - name: 检查产物
        if: always()
        run: |
          echo "=== bin 目录 ==="
          ls -laR bin/ 2>/dev/null || echo "❌ bin 不存在"
          echo ""
          echo "=== build.log 末尾 ==="
          tail -30 build.log 2>/dev/null

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: liveauth-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 清理
        if: always()
        run: rm -f release.keystore
