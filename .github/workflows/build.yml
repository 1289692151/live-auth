name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 还原 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ls -la release.keystore

      - name: 强制使用我们的 keystore
        run: |
          sed -i 's/^android.release = True/# android.release = True/' buildozer.spec
          sed -i "s|android.keystore = .*|android.keystore = /home/runner/work/live-auth/live-auth/release.keystore|" buildozer.spec
          sed -i "s|android.keystore_passwd = .*|android.keystore_passwd = ${{ secrets.KEYSTORE_PASS }}|" buildozer.spec
          sed -i "s|android.keyalias = .*|android.keyalias = ${{ secrets.KEY_ALIAS }}|" buildozer.spec
          sed -i "s|android.keypasswd = .*|android.keypasswd = ${{ secrets.KEY_PASS }}|" buildozer.spec
          mkdir -p bin
          cp release.keystore bin/release.keystore
          echo "=== 签名配置 ==="
          grep -E "android\.(keystore|key|release)" buildozer.spec

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 检查磁盘 + swap
        run: |
          df -h
          sudo apt-get clean
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool-bin autoconf libltdl-dev libffi-dev libssl-dev openjdk-17-jdk unzip git zip zlib1g-dev

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.33

      - name: 打包
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: 验证 APK 签名
        if: always()
        run: |
          rm -f bin/*.aab
          if ! ls bin/*.apk 2>/dev/null; then
            echo "❌ 没找到 APK"
            ls -la bin/ 2>/dev/null
            exit 1
          fi
          APK=$(ls bin/*.apk | head -1)
          echo "🔏 验证签名：$APK"
          CN=$(jarsigner -verify -verbose:summary -certs "$APK" 2>&1 | grep -oE "CN=[^,]+" | head -1)
          echo "签名: $CN"
          if echo "$CN" | grep -q "Android Debug"; then
            echo "❌❌❌ APK 用的是 Android Debug 临时签名！"
            exit 1
          fi
          echo "✅ 签名正确"

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: liveauth-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 清理
        if: always()
        run: rm -f release.keystore bin/release.keystore
